<text x="132" y="48" class="nb">Stückliste</text>
<text x="132" y="52.3" class="n">Alu-Blech 1 mm (AlMg3 o. ä.):</text>
<text x="132" y="56.599999999999994" class="n">  Teil A  Zuschnitt 116 × 186</text>
<text x="132" y="60.89999999999999" class="n">  Teil B  Zuschnitt 65 × 56</text>
<text x="132" y="65.19999999999999" class="n">4× Blindniet Alu Ø3,2 × 6</text>
<text x="132" y="69.49999999999999" class="n">2× M4 × 10 + Mutter (oder Blindniet Ø4)</text>
<text x="132" y="73.79999999999998" class="n"></text>
<text x="132" y="78.09999999999998" class="nb">Reihenfolge</text>
<text x="132" y="82.39999999999998" class="n">1  Vorlage 100 % drucken, Kontrollmaß prüfen,</text>
<text x="132" y="86.69999999999997" class="n">    aufkleben, schneiden, alle Kanten entgraten.</text>
<text x="132" y="90.99999999999997" class="n">2  Fuß- und Laschenlöcher bohren (Teil B),</text>
<text x="132" y="95.29999999999997" class="n">    Wangenlöcher in Teil A noch NICHT.</text>
<text x="132" y="99.59999999999997" class="n">3  Biegen in der Reihenfolge ①②③.</text>
<text x="132" y="103.89999999999996" class="n">4  Rampe nach Anriss einsetzen, Wangen durch</text>
<text x="132" y="108.19999999999996" class="n">    die Laschen abbohren, nieten.</text>
<text x="132" y="112.49999999999996" class="n">    Nietköpfe liegen unter der Rutschfläche.</text>
<text x="132" y="116.79999999999995" class="n">5  Erst aus Pappe bauen und ≥ 20 Münzen</text>
<text x="132" y="121.09999999999995" class="n">    testen, dann Blech. Türschlitz zuletzt.</text>
<text x="132" y="125.39999999999995" class="n"></text>
<text x="132" y="129.69999999999996" class="nb">Hinweise</text>
<text x="132" y="133.99999999999997" class="n">• Maße sind Innenmaße; Biegeverkürzung bei</text>
<text x="132" y="138.29999999999998" class="n">   1 mm Alu (≈ 1 mm je Biegung) unkritisch.</text>
<text x="132" y="142.6" class="n">• Spalt Hopper–Tür am Schrank messen und</text>
<text x="132" y="146.9" class="n">   GAP im Skript anpassen (Wange = Spalt − 3).</text>
<text x="132" y="151.20000000000002" class="n">• Trichter nur am Schrankboden befestigen,</text>
<text x="132" y="155.50000000000003" class="n">   nicht an Hopper oder Tür.</text>
<text x="132" y="159.80000000000004" class="n">• Schräge an den Laschen von Teil B hält sie</text>
<text x="132" y="164.10000000000005" class="n">   frei vom Hopper-Seitenblech.</text>
<text x="132" y="168.40000000000006" class="n">• Auslass und Türschlitz ≥ 30 hoch, damit</text>
<text x="132" y="172.70000000000007" class="n">   auch hochkant rollende Münzen durchgehen.</text>
</svg>