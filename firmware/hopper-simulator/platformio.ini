; Hopper simulator — flash this to the SECOND D1 mini.
; Do not flash it to the dispenser board.
[platformio]
default_envs = simulator
src_dir = .

[env:simulator]
; Same pin as the dispenser's env (issue #7): the simulator is a measuring
; instrument, and one whose platform moves under it measures the wrong thing.
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
; PlatformIO converts the sketch to <name>.ino.cpp before the filter is
; applied, so a filter of only +<*.ino> matches nothing and the build ends in
; "Nothing to build". Same pair as the dispenser's env.
build_src_filter = +<*.cpp> +<*.ino>
monitor_speed = 115200
upload_speed = 921600
