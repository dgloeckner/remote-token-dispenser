; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp8266
; The sketch sources live next to this file (Arduino layout), not in src/.
src_dir = .

[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
build_src_filter = +<*.cpp> +<*.ino> -<test/> -<hopper-simulator/>
lib_deps =
    ESP8266WiFi
    ESPAsyncWebServer
    ArduinoJson@^7.0.0
monitor_speed = 115200
upload_speed = 921600

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++11
    -DUNIT_TEST
    -I./test/mocks
    -I.
; The native test binary links the REAL production sources.  Everything that
; needs the ESP SDK (WiFi, EEPROM, async web server, GPIO) is filtered out;
; what is left is pure logic and is what the unit tests exercise.
; Adding a new Arduino-free source file?  List it here, or it is untested.
build_src_filter =
    +<dispense_manager.cpp>
    +<error_decoder.cpp>
    +<error_history.cpp>
test_build_src = yes
