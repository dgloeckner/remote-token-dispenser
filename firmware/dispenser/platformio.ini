; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp8266
; The sketch sources live next to this file (Arduino layout), not in src/.
src_dir = .

[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
build_src_filter = +<*.cpp> +<*.ino> -<test/> -<hopper-simulator/>
; The version is a build flag, not a literal in config.h: a release build that
; still says "DEBUG" is how 1.1.0-DEBUG-error-decoding reached the boathouse.
; LOG_LEVEL 2 is one line per state transition; 3 adds the per-token and
; per-field chatter that used to be sent unconditionally (issue #4).
build_flags =
    -DFIRMWARE_VERSION='"1.2.0"'
    -DLOG_LEVEL=2
; ESPAsyncWebServer must be owner-qualified: three forks publish that name and
; an unqualified entry resolved to esp32async/ESPAsyncWebServer, whose ESP32
; transitive dependencies (AsyncTCP, RPAsyncTCP) do not compile for the ESP8266
; ("fatal error: WiFi.h: No such file or directory").  The fork below is the
; same code; lib_ignore keeps the LDF from building the two ESP32 TCP layers
; alongside ESPAsyncTCP, which is the one an ESP8266 uses.
; Broader dependency hardening (pinning every transitive version) is #7.
lib_deps =
    ESP8266WiFi
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/ESPAsyncTCP@^2.0.0
    ArduinoJson@^7.0.0
lib_ignore =
    AsyncTCP
    RPAsyncTCP
monitor_speed = 115200
upload_speed = 921600

[env:native]
platform = native
test_framework = unity
; LOG_LEVEL 3 on the host so every LOG_* format string is compiled and checked
; against its arguments; MockSerial swallows the output.
build_flags =
    -std=c++11
    -DUNIT_TEST
    -I./test/mocks
    -I.
    -DLOG_LEVEL=3
; The native test binary links the REAL production sources.  Everything that
; needs the ESP SDK (WiFi, EEPROM, async web server, GPIO) is filtered out;
; what is left is pure logic and is what the unit tests exercise.
; Adding a new Arduino-free source file?  List it here, or it is untested.
build_src_filter =
    +<crash_state.cpp>
    +<dispense_manager.cpp>
    +<error_decoder.cpp>
    +<error_history.cpp>
    +<pulse_filter.cpp>
    +<request_body.cpp>
    +<wifi_supervisor.cpp>
test_build_src = yes
